[tools]

python = "3.12.13"
ruby = "3.4.8"
uv = "latest"

"github:sparkle-project/Sparkle" = { version = "2.10.0", asset_pattern = "Sparkle-*.tar.xz", bin_path = "bin" }

"pipx:adafruit-nrfutil" = "0.5.3.post16"
"pipx:changes-semver" = "6"
"pipx:inseven-build-tools" = "1"

[settings]

minimum_release_age_excludes = ["pipx:changes-semver", "pipx:inseven-build-tools"]

[env]

# Ensure uv uses the Python provisioned by mise above rather than silently downloading an interpreter of its own.
UV_PYTHON_PREFERENCE = "only-system"
